services:
  - type: web
    name: techtitan-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://notessharinggroup.onrender.com
      - key: FIREBASE_PROJECT_ID
        value: tech-titan-team
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_SENDER_EMAIL
        sync: false

  - type: web
    name: notessharinggroup
    runtime: static
    buildCommand: npm ci && npm run build --workspace client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://techtitan-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
